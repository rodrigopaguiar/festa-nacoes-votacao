<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Votação ao vivo</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root { --green: #0f6e56; --bg: #0f1b17; --card: #16261f; --border: #24382f; --text: #f4f2ea; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 40px;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: clamp(26px, 4vw, 42px); font-weight: 600; text-align: center; margin: 0 0 8px; }
  .total { text-align: center; font-size: 18px; color: #9fb8ac; margin-bottom: 40px; }
  .total b { color: var(--text); font-size: 22px; }
  .bar-row { margin-bottom: 26px; }
  .bar-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .bar-label .name { font-size: clamp(18px, 2.4vw, 26px); font-weight: 600; }
  .bar-label .count { font-size: clamp(16px, 2vw, 22px); color: #9fb8ac; }
  .bar-track { background: var(--card); border: 1px solid var(--border); border-radius: 12px; height: 46px; overflow: hidden; }
  .bar-fill {
    height: 100%; background: linear-gradient(90deg, #1d9e75, #5dcaa5);
    border-radius: 12px; transition: width 0.6s ease; min-width: 4px;
    display: flex; align-items: center; justify-content: flex-end; padding-right: 12px;
  }
  .bar-fill span { font-size: 15px; font-weight: 600; color: #04342c; }
  .msg { text-align: center; font-size: 24px; margin-top: 80px; color: #9fb8ac; }
  .leader .bar-fill { background: linear-gradient(90deg, #f2a623, #fcde5a); }
  .leader .bar-fill span { color: #412402; }
</style>
</head>
<body>
<div class="wrap">
  <div id="content"><div class="msg">Carregando…</div></div>
</div>

<script src="firebase-config.js"></script>
<script>
const params = new URLSearchParams(location.search);
const pollId = params.get('poll');
const content = document.getElementById('content');

if (!pollId) {
  content.innerHTML = '<div class="msg">Link inválido: nenhuma votação informada.</div>';
} else {
  let pollData = null;

  db.collection('polls').doc(pollId).onSnapshot(doc => {
    if (!doc.exists) {
      content.innerHTML = '<div class="msg">Votação não encontrada.</div>';
      return;
    }
    pollData = doc.data();
    render();
  });

  db.collection('polls').doc(pollId).collection('votes').onSnapshot(snap => {
    if (!pollData) return;
    const counts = {};
    pollData.options.forEach(o => counts[o.id] = 0);
    let total = 0;
    snap.forEach(v => {
      const data = v.data();
      (data.optionIds || []).forEach(id => {
        if (counts[id] !== undefined) counts[id]++;
      });
      total++;
    });
    render(counts, total, snap.size);
  });

  function render(counts, totalVoters) {
    if (!pollData) return;
    counts = counts || {};
    pollData.options.forEach(o => { if (counts[o.id] === undefined) counts[o.id] = 0; });

    const maxCount = Math.max(1, ...pollData.options.map(o => counts[o.id] || 0));
    const totalVotes = pollData.options.reduce((s, o) => s + (counts[o.id] || 0), 0);

    const sorted = [...pollData.options].sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
    const topCount = counts[sorted[0]?.id] || 0;

    const rows = sorted.map(o => {
      const c = counts[o.id] || 0;
      const pct = totalVotes > 0 ? Math.round((c / totalVotes) * 100) : 0;
      const widthPct = Math.max(4, Math.round((c / maxCount) * 100));
      const isLeader = c === topCount && c > 0;
      return `
        <div class="bar-row ${isLeader ? 'leader' : ''}">
          <div class="bar-label">
            <span class="name">${escapeHtml(o.label)}</span>
            <span class="count">${c} voto${c === 1 ? '' : 's'} · ${pct}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${widthPct}%">
              <span>${pct > 8 ? pct + '%' : ''}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    content.innerHTML = `
      <h1>${escapeHtml(pollData.question)}</h1>
      <div class="total"><b>${totalVoters !== undefined ? totalVoters : totalVotes}</b> pessoa(s) já votaram</div>
      ${rows}
    `;
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
