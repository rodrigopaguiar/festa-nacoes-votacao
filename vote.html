<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votação</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root { --green: #0f6e56; --bg: #f6f5f1; --card: #ffffff; --border: #ddd8cc; --text: #2c2c2a; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
  .wrap { max-width: 480px; width: 100%; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-top: 40px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 18px; line-height: 1.4; }
  .hint { font-size: 13px; color: #888; margin-bottom: 18px; }
  .option {
    display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 10px; cursor: pointer; font-size: 16px; transition: border-color .15s, background .15s;
  }
  .option:active { background: #f0efe9; }
  .option.selected { border-color: var(--green); background: #eaf5f1; }
  .option input { width: 18px; height: 18px; accent-color: var(--green); flex-shrink: 0; }
  button.submit {
    width: 100%; margin-top: 12px; background: var(--green); color: #fff; border: none;
    border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button.submit:disabled { background: #bbb; cursor: default; }
  .msg { text-align: center; font-size: 16px; padding: 40px 10px; }
  .msg .big { font-size: 40px; margin-bottom: 10px; }
  .error { color: #b3261e; font-size: 13px; margin-top: 10px; }
  .changeLink { text-align: center; font-size: 13px; color: #888; margin-top: 14px; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="msg">Carregando…</div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script>
const params = new URLSearchParams(location.search);
const pollId = params.get('poll');
const card = document.getElementById('card');

function getDeviceId() {
  let id = localStorage.getItem('voter_device_id');
  if (!id) {
    id = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('voter_device_id', id);
  }
  return id;
}
const deviceId = getDeviceId();

if (!pollId) {
  card.innerHTML = '<div class="msg">Link inválido: nenhuma votação informada.</div>';
} else {
  // login anônimo silencioso — as regras exigem apenas que o request
  // seja autenticado ou não, dependendo da configuração; aqui usamos
  // acesso público sem exigir auth (ver firestore.rules)
  loadPoll();
}

let currentPoll = null;
let myVote = null;

async function loadPoll() {
  db.collection('polls').doc(pollId).onSnapshot(async doc => {
    if (!doc.exists) {
      card.innerHTML = '<div class="msg">Votação não encontrada.</div>';
      return;
    }
    currentPoll = { id: doc.id, ...doc.data() };

    if (currentPoll.status === 'rascunho') {
      card.innerHTML = '<div class="msg"><div class="big">⏳</div>Essa votação ainda não foi aberta.<br>Volte a esta página em instantes.</div>';
      return;
    }
    if (currentPoll.status === 'encerrada') {
      const voteDoc = await db.collection('polls').doc(pollId).collection('votes').doc(deviceId).get();
      const voted = voteDoc.exists;
      card.innerHTML = `<div class="msg"><div class="big">✔</div>Votação encerrada.${voted ? '<br>Obrigado por participar!' : ''}</div>`;
      return;
    }

    const voteDoc = await db.collection('polls').doc(pollId).collection('votes').doc(deviceId).get();
    myVote = voteDoc.exists ? voteDoc.data().optionIds : [];
    renderForm();
  });
}

function renderForm() {
  const isMulti = currentPoll.type === 'multi';
  const optionsHtml = currentPoll.options.map(opt => {
    const checked = myVote && myVote.includes(opt.id) ? 'selected' : '';
    return `
      <label class="option ${checked}" id="label-${opt.id}">
        <input type="${isMulti ? 'checkbox' : 'radio'}" name="vote" value="${opt.id}"
          ${myVote && myVote.includes(opt.id) ? 'checked' : ''}
          onchange="onSelect('${opt.id}', ${isMulti})">
        <span>${escapeHtml(opt.label)}</span>
      </label>
    `;
  }).join('');

  card.innerHTML = `
    <h1>${escapeHtml(currentPoll.question)}</h1>
    <div class="hint">${isMulti ? 'Você pode escolher mais de uma opção.' : 'Escolha apenas uma opção.'}</div>
    <div id="optionsArea">${optionsHtml}</div>
    <button class="submit" id="submitBtn" onclick="submitVote()" ${myVote && myVote.length ? '' : 'disabled'}>
      ${myVote && myVote.length ? 'Atualizar meu voto' : 'Confirmar voto'}
    </button>
    <div class="error" id="voteError"></div>
  `;
}

function onSelect(optId, isMulti) {
  document.getElementById('submitBtn').disabled = false;
  if (!isMulti) {
    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    document.getElementById('label-' + optId).classList.add('selected');
  } else {
    const el = document.getElementById('label-' + optId);
    el.classList.toggle('selected', el.querySelector('input').checked);
  }
}

async function submitVote() {
  const selected = [...document.querySelectorAll('#optionsArea input:checked')].map(i => i.value);
  const errEl = document.getElementById('voteError');
  errEl.textContent = '';

  if (selected.length === 0) {
    errEl.textContent = 'Selecione uma opção antes de confirmar.';
    return;
  }

  document.getElementById('submitBtn').disabled = true;
  try {
    await db.collection('polls').doc(pollId).collection('votes').doc(deviceId).set({
      optionIds: selected,
      votedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    card.innerHTML = '<div class="msg"><div class="big">✔</div>Voto registrado!<br>Obrigado por participar.</div><div class="changeLink" onclick="renderForm()">Quero mudar meu voto</div>';
    myVote = selected;
  } catch (err) {
    errEl.textContent = 'Erro ao votar: ' + err.message;
    document.getElementById('submitBtn').disabled = false;
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
